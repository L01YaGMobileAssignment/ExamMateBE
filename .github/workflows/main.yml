name: Deploy FastAPI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret-key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
        run: uv run pytest --cov=app --cov-report=term-missing tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test # Only deploy if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only deploy on push to main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/app
            git pull origin main
            
            # 1. Re-create .env file from Github secrets
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
            echo "GEMINI_API_KEY2=${{ secrets.GEMINI_API_KEY2 }}" >> .env
            echo "GEMINI_API_KEY3=${{ secrets.GEMINI_API_KEY3 }}" >> .env
            echo "MODEL_NAME=${{ secrets.MODEL_NAME }}" >> .env
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
            echo "ALGORITHM=${{ secrets.ALGORITHM }}" >> .env
            echo "ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" >> .env

            # 2. Update dependencies
            uv sync
            
            # 3. Initialize Database
            # uv run python -m app.db.init_db
            
            # 4. Restart Service
            sudo systemctl restart fastapi_app
